# Configuración de EduSoft API.
# Cada valor puede sobrescribirse con una variable de entorno (ver README del backend).
# Los valores por defecto sirven SOLO para desarrollo local; en producción define
# DB_URL, DB_USER y DB_PASSWORD con credenciales propias.
spring:
  application:
    name: edusoft-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edusoft-db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update crea/ajusta tablas automáticamente; en producción usa "validate" o "none".
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Orígenes del frontend autorizados por CORS (separados por coma).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}
